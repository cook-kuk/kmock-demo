s":["대기 시간이 줄어든 것을 자동화의 성과로 볼 수는 없다.","이의 신청 사례가 줄어들면 자동화는 성공한 것이다.","속도 외의 지표로도 자동화의 효과를 검증해야 한다.","자동화에 앞서 디지털 기기 사용 교육부터 실시해야 한다."],"underlines":[],"answer":3,"transcript":"","explanation":"대기 시간 감소라는 성과만으로 이용자 경험의 개선을 단정할 수 없으므로 이의 신청과 디지털 취약 이용자의 경험 등 다른 지표도 확인해야 합니다.","sample_answer":"","passage":"행정 서비스를 자동화하면 처리 속도는 빨라질 수 있고, 실제로 여러 기관에서 대기 시간이 줄었다. 그러나 처리 시간이 줄었다는 사실만으로 이용자의 경험이 개선됐다고 단정하기는 어렵다. 이의 신청이 필요한 사례나 디지털 기기에 익숙하지 않은 사람들의 불편도 함께 조사해야 한다.","answer_provenance":"AI 풀이 기반 임시 정답 · 원본에 정답표 없음"},{"id":"L5-07","level":5,"section":"listening","question":"남자의 설명으로 알 수 있는 것을 고르십시오.","options":["독서 시간과 성적 사이에는 아무 관계도 없다고 보아야 한다.","두 변수 사이의 원인 관계는 추가 조사 없이 단정할 수 없다.","독서가 성적을 높인다는 결론이 이번 조사로 확인되었다.","성적이 높은 학생들이 독서를 더 많이 했다고 보는 것이 맞다."],"underlines":[],"answer":2,"transcript":"여자: 이 조사에서는 독서 시간이 긴 학생일수록 성적이 높게 나왔네요. 독서가 성적을 높인다고 결론 내려도 될까요?\n남자: 두 변수가 함께 움직였다는 건 알 수 있지만, 다른 요인이 영향을 미쳤을 수도 있습니다. 인과관계는 추가 조사 없이 확정하기 어렵습니다.","explanation":"독서 시간과 성적이 함께 움직인다는 상관관계만으로는 인과관계를 확정할 수 없고 다른 요인과 추가 조사를 고려해야 합니다.","sample_answer":"","passage":"","answer_provenance":"AI 풀이 기반 임시 정답 · 원본에 정답표 없음"},{"id":"L5-08","level":5,"section":"listening","question":"여자가 우려하는 점을 고르십시오.","options":["효율이 높은 기기는 가격이 비싸서 널리 보급되기 어렵다.","전자제품의 효율을 높이는 사업은 방향 자체가 잘못되었다.","사용 비용이 줄어들면 사람들이 기기를 더 자주 바꾸게 된다.","효율이 좋아져도 사용이 늘면 전체 소비가 줄지 않을 수 있다."],"underlines":[],"answer":4,"transcript":"남자: 전기 사용량을 줄이기 위해 전자제품의 효율을 높이는 사업을 추진 중입니다.\n여자: 좋은 방향이지만, 사용 비용이 줄었다고 기기를 더 오래 사용하면 총 전력 소비가 줄지 않을 수도 있어요. 실제 사용 방식까지 조사해야 합니다.","explanation":"효율 향상으로 사용 비용이 낮아져 사용 시간이 늘어나면 총 전력 소비가 줄지 않을 수 있다는 우려입니다.","sample_answer":"","passage":"","answer_provenance":"AI 풀이 기반 임시 정답 · 원본에 정답표 없음"},{"id":"L5-09","level":5,"section":"writing","question":"다음 자료를 참고하여 '대학생의 강의 방식 선호'에 대한 글을 200~300자로 쓰십시오.","options":[],"underlines":[],"answer":null,"transcript":"","explanation":"","sample_answer":"","passage":"[A대학 재학생 500명 설문: 선호 강의 방식]\n녹화 강의 38% / 실시간 강의 45% / 두 방식 병행 17%\n[각 방식 선호자의 주요 이유: 상위 응답]\n녹화 강의: 시간이 자유롭다 62%, 반복 function selection(){const l=$('#level')?.value||'all',s=$('#section')?.value||'all';return bank.filter(q=>(l==='all'||q.level===Number(l))&&(s==='all'||q.section===s));}
function countSelection(){const n=selection().length;$('#selectedCount').textContent=n;$('#start').disabled=!n||!!current;$('#start').textContent=current?'진행 중인 시험을 먼저 완료해 주세요':n?`${n}문항 시험 시작하기  →`:'문항 파일을 먼저 불러와 주세요';}
function home(){stopSpeech();view='home';$('#app').innerHTML=`<section class="hero"><div><span class="eyebrow">YOUR NEXT STEP IN KOREAN</span><h1>차근차근 풀고,<br><em>나의 한국어를 발견하세요.</em></h1><p>문제를 푸는 시간부터, 틀린 답을 이해하는 순간까지.<br>나에게 맞는 속도로 준비하는 한국어 모의시험.</p></div><div class="hero-art" aria-hidden="true"><div class="ring"></div><div class="paper"><strong>가</strong><span></span><span></span><span></span></div><div class="art-badge">한 걸음 더, 한국어</div></div></section>${!bank.length?'<div class="notice"><strong>문항 원본 연결 대기</strong><span>K-MOCK 60문항 원본이 아직 등록되지 않았어요. 최종 문항 JSON을 불러오면 시험을 시작할 수 있어요.</span></div>':''}${current?`<div class="notice"><strong>진행 중인 시험</strong><span>${current.items.length}문항 · ${current.items.filter(q=>answered(q,current.answers)).length}문항 작성 · 남은 시간 <span id="resumeTimer">${fmt(remaining())}</span></span><button class="link" data-action="resume">이어서 풀기 →</button></div>`:''}<div class="layout"><section class="panel"><div class="section-heading"><div><h2>나의 모의시험</h2><span class="small muted">원하는 급수와 영역을 골라 시작하세요.</span></div><span class="pill">고정 문항 연습</span></div><div class="stats"><div class="stat"><strong>${bank.length||'—'}</strong><span>등록된 문항</span></div><div class="stat"><strong>${bank.length?new Set(bank.map(q=>q.level).filter(Boolean)).size:'—'}</strong><span>급수</span></div><div class="stat"><strong>${history.length}</strong><span>완료한 시험</span></div></div><div class="source-card"><span class="pill">60문항 기본 수록</span><strong>한국어 평가문항 시연본 · 1~6급</strong><p>읽기 38 · 듣기 14 · 쓰기 8<br>급수별 10문항씩, 파일 선택 없이 바로 시작하세요.<br>급수는 목표 수준이며 실제 난이도는 검증 전입니다.</p><small>원본: ${esc(bankName)}</small></div><div class="config"><label>목표 급수<select id="level"><option value="all">전체 급수</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}급</option>`).join('')}</select></label><label>시험 영역<select id="section"><option value="all">전체 영역</option><option value="reading">읽기</option><option value="listening">듣기</option><option value="writing">쓰기</option></select></label><label>제한 시간 (분)<input id="minutes" type="number" min="1" max="240" value="60"></label></div><p class="small muted">선택 문항 <strong id="selectedCount">${bank.length}</strong>개 · 시간은 연습용으로 직접 설정해요.</p><button id="start" class="primary wide" data-action="start" disabled>문항 파일을 먼저 불러와 주세요</button><p class="small muted" style="margin-top:18px">원본에는 정답표가 없어 객관식 52문항은 본문 풀이로 작성한 <strong>임시 정답</strong>으로 채점합니다. 쓰기 8문항은 채점하지 않습니다.</p></section><aside><section class="panel"><span class="eyebrow">HOW IT WORKS</span><h3 style="margin-top:12px">시험은 이렇게 진행돼요</h3><ol class="steps"><li><b>1</b><div><strong>시험 준비</strong><span>급수·영역을 선택하고 바로 시작해요.</span></div></li><li><b>2</b><div><strong>집중해서 풀기</strong><span>답안은 자동 저장돼요. 어려운 문제는 표시해 두세요.</span></div></li><li><b>3</b><div><strong>결과 돌아보기</strong><span>객관식 임시 정답과 해설을 확인하며 복습해요.</span></div></li></ol></section><p class="side-note">이 HTML 하나로 실행돼요. 로그인·설치·서버가 필요 없어요. 답안은 브라우저 저장을 시도하며, 파일 이동이나 브라우저 설정에 따라 복구되지 않을 수 있으니 결과 파일도 내려받아 보관하세요. 듣기는 기기의 한국어 음성 또는 대본으로 연습해요.</p></aside></div>`;
 $('#level').onchange=countSelection;$('#section').onchange=countSelection;countSelection();}

function start(){const items=selection();const min=Number($('#minutes').value);if(!items.length||current)return;if(!Number.isInteger(min)||min<1||min>240){toast('제한 시간은 1~240분의 정수로 입력해 주세요.');return;}const missing=items.filter(q=>q.section==='listening'&&!q.transcript);if(missing.length){toast(`듣기 대본이 없는 문항 ${missing.length}개가 있어요. 읽기·쓰기를 선택하거나 대본을 추가해 주세요.`);return;}current={id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),items,answers:{},flags:[],index:0,started:Date.now(),deadline:Date.now()+min*60000,minutes:min,source:bankName,transcriptViewed:[]};persist();exam();window.scrollTo(0,0);}
function exam(){if(!current)return home();if(remaining()===0)return submit(true);stopSpeech();view='exam';const c=current,q=c.items[c.index],n=c.items.filter(q=>answered(q,c.answers)).length;$('#app').innerHTML=`<div class="exam-head"><div><span class="eyebrow">K-MOCK PRACTICE</span><h1>나의 한국어 모의시험</h1><span class="small muted">${c.items.length}문항 · ${c.minutes}분 · 연습 모드</span></div><button class="mobile-map-toggle" data-action="map" aria-expanded="false" aria-controls="questionMap">문항 목록 · ${c.index+1}/${c.items.length} ▾</button><div class="timer-wrap"><span class="small muted">남은 시간</span><div id="timer" class="timer">${fmt(remaining())}</div></div></div><div class="layout"><div><section class="panel question-panel"><div class="qmeta"><span>${esc(q.id)} · ${q.level?q.level+'급 · ':''}${names[q.section]}</span><button class="${c.flags.includes(q.id)?'flag-on':''}" data-action="flag">${c.flags.includes(q.id)?'★ 표시됨':'☆ 나중에 보기'}</button></div><h2 tabindex="-1" id="questionTitle">${c.index+1}. ${esc(q.question)}</h2>${q.section==='listening'?`<div class="audio-box"><button class="secondary" data-action="listen">▷ 듣기 재생</button> <button data-action="stopAudio">정지</button><button class="link" data-action="transcript">대본으로 연습</button><p id="audioStatus" role="status">기기에 설치된 한국어 음성으로 재생합니다. 음성이 없으면 ‘대본으로 연습’을 이용하세요.</p><div id="transcriptPanel" class="transcript" hidden><strong>대본 연습 모드</strong><p>${esc(q.transcript)}</p></div></div>`:''}${q.passage?`<div class="passage">${formatPassage(q)}</div>`:''}${q.section==='writing'?`<textarea id="writing" aria-label="쓰기 답안" placeholder="여기에 답안을 작성하세요…">${esc(c.answers[q.id]||'')}</textarea><div class="small muted" style="text-align:right"><span id="charCount">${String(c.answers[q.id]||'').length}</span>자 · 공백 포함</div>`:`<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map((o,i)=>`<label class="option ${c.answers[q.id]===i+1?'chosen':''}"><input type="radio" name="answer" value="${i+1}" ${c.answers[q.id]===i+1?'checked':''}><span class="choice-number">${i+1}</span><span>${esc(o)}</span></label>`).join('')}</div>`}<div class="save-note" id="saveNote">${saveFailed?'저장 실패 · 결과 파일을 내려받아 주세요.':'답안은 이 브라우저에 자동 저장됩니다.'}</div></section><div class="question-bottom"><button class="secondary" data-action="prev" ${c.index===0?'disabled':''}>← 이전 문항</button><span class="small muted" style="padding:10px">${c.index+1} / ${c.items.length}</span><button class="primary" data-action="${c.index===c.items.length-1?'confirm':'next'}">${c.index===c.items.length-1?'제출하기':'다음 문항 →'}</button></div></div><aside id="questionMap" class="panel exam-nav"><h3>나의 답안 현황</h3><div class="small muted"><span id="answeredCount">${n}</span> / ${c.items.length}문항 작성</div><div class="progress"><div id="answerProgress" style="width:${n/c.items.length*100}%"></div></div><div class="nav-grid">${c.items.map((x,i)=>`<button data-action="jump" data-index="${i}" class="${answered(x,c.answers)?'answered ':''}${i===c.index?'current ':''}${c.flags.includes(x.id)?'flagged':''}" aria-label="${i+1}번 문항${answered(x,c.answers)?', 작성 완료':''}${c.flags.includes(x.id)?', 나중에 보기':''}" ${i===c.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend"><span><i></i>작성 완료</span><span><i class="flag-dot"></i>나중에 보기</span></div><button class="primary wide" style="margin-top:25px" data-action="confirm">시험 제출하기</button><button class="wide small" data-action="home">시험실로 돌아가기</button><p class="small muted">시험실로 이동해도 제한 시간은 계속 흘러갑니다. 새로고침 후에도 이어서 풀 수 있어요.</p></aside></div>`;
 if(q.section==='writing')$('#writing').addEventListener('input',e=>{c.answers[q.id]=e.target.value;$('#charCount').textContent=e.target.value.length;answerChanged();});else document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=e=>{c.answers[q.id]=Number(e.target.value);document.querySelectorAll('.option').forEach(l=>l.classList.toggle('chosen',l.querySelector('input').checked));answerChanged();});}
function answerChanged(){persist();const n=current.items.filter(q=>answered(q,current.answers)).length;$('#answeredCount').textContent=n;$('#answerProgress').style.width=n/current.items.length*100+'%';document.querySelectorAll('.nav-grid button').forEach((b,i)=>b.classList.toggle('answered',answered(current.items[i],current.answers)));$('#saveNote').textContent=saveFailed?'자동 저장 실패 · 결과 파일을 내려받아 주세요.':'✓ 방금 자동 저장했어요';}
function confirmSubmit(){if(!current)return;const n=current.items.filter(q=>!answered(q,current.answers)).length;$('#confirmText').textContent=n?`아직 ${n}문항에 답하지 않았어요. 미응답 객관식 문항은 오답으로 처리됩니다.`:'모든 문항에 답했어요. 제출하면 결과를 확인할 수 있어요.';$('#confirm').showModal();}
$('#confirm').addEventListener('close',()=>{if($('#confirm').returnValue==='submit'&&current)submit(false);});
function submit(auto){if(!current)return;stopSpeech();if($('#confirm').open){$('#confirm').returnValue='cancel';$('#confirm').close();}const record={...current,finished:Date.now(),automatic:auto,result:KMock.score(current.items,current.answers)};history.unshift(record);history=history.slice(0,30);current=null;persist();result(record);if(auto)toast('제한 시간이 끝나 답안이 자동 제출되었어요.');}
function result(r){stopSpeech();view='result';reviewRecord=r;const s=r.result;$('#app').innerHTML=`<span class="eyebrow">YOUR PRACTICE REPORT</span><div class="result-hero"><div><p>${new Date(r.finished).toLocaleString('ko-KR')}</p><h1>수고했어요. 한 걸음 더 나아갔어요.</h1><p>${s.total}문항 중 ${s.answered}문항 작성${r.automatic?' · 시간 종료 자동 제출':''}${r.transcriptViewed?.length?' · 듣기 대본 열람 '+r.transcriptViewed.length+'문항':''}</p></div><div class="score-big">${s.percent===null?'—':s.percent}<small>${s.percent===null?'':'%'} 정답률</small></div></div><div class="layout"><section class="panel"><div class="section-heading"><div><h2>영역별 돌아보기</h2><p class="small muted">원본에 정답표가 없어 AI 풀이 기반 임시 정답으로 채점했어요. 쓰기·공식 등급 평가는 제공하지 않아요.</p></div></div><div class="result-bars">${Object.entries(names).filter(([key])=>r.items.some(q=>q.section===key)).map(([key,name])=>{const rows=s.detail.filter(d=>d.section===key),g=rows.filter(d=>d.gradable),c=g.filter(d=>d.correct).length;return `<div><div class="bar-title"><strong>${name}</strong><span>${g.length?`${c} / ${g.length} 정답`:`${rows.length}문항 채점 대기`}</span></div><div class="progress"><div style="width:${g.length?c/g.length*100:0}%"></div></div></div>`;}).join('')}</div><div class="stats"><div class="stat"><strong>${s.correct}</strong><span>정답</span></div><div class="stat"><strong>${s.gradable-s.correct}</strong><span>오답·미응답</span></div><div class="stat"><strong>${s.pending}</strong><span>채점 대기</span></div></div></section><aside class="panel"><h3>오늘의 학습을 남겨요</h3><p class="small muted">답안과 채점 결과를 파일로 보관할 수 있어요. 쓰기는 검토용으로 저장되며 점수가 매겨지지 않아요.</p><button class="primary wide" data-action="export">결과 JSON 내려받기 ↓</button><button class="secondary wide" style="margin-top:10px" data-action="home">새 시험 준비하기</button></aside></div><section class="panel" style="margin-top:25px"><div class="section-heading"><h2>문항별 임시 정답과 해설</h2><span class="pill">${s.total}문항 복습</span></div>${r.items.map((q,i)=>{const d=s.detail[i];return `<details class="review-item"><summary><span class="small muted">${String(i+1).padStart(2,'0')}</span><strong>${esc(q.question)}</strong><span class="status ${!d.gradable?'pending':d.correct?'':'wrong'}">${!d.gradable?'채점 대기':d.correct?'정답':d.answered?'오답':'미응답'}</span></summary><div class="review-body"><p class="small muted">${esc(q.id)} · ${q.level?q.level+'급 · ':''}${names[q.section]}</p>${q.passage?`<div class="passage">${formatPassage(q)}</div>`:''}${q.transcript?`<p><strong>듣기 대본</strong><br>${esc(q.transcript)}</p>`:''}${q.section==='writing'?`<p><strong>내 답안</strong><br>${esc(r.answers[q.id]||'작성하지 않았어요.')}</p>${q.sample_answer?`<p><strong>예시 답안</strong><br>${esc(q.sample_answer)}</p>`:''}`:`<ul class="review-options">${q.options.map((o,j)=>`<li class="${q.answer===j+1?'correct-option':r.answers[q.id]===j+1?'wrong-option':''}">${j+1}. ${esc(o)} ${q.answer===j+1?'✓ 정답':''} ${r.answers[q.id]===j+1?'← 내 답':''}</li>`).join('')}</ul>`}${q.explanation?`<div class="explanation"><strong>해설</strong><br>${esc(q.explanation)}</div>`:'<p class="small muted">이 문항에는 해설이 등록되지 않았어요.</p>'}</div></details>`;}).join('')}</section>`;window.scrollTo(0,0);}
function showHistory(){stopSpeech();view='history';$('#app').innerHTML=`<span class="eyebrow">YOUR LEARNING JOURNEY</span><h1>응시 기록</h1><p class="muted">최근 30회의 기록이 이 브라우저에 저장돼요.</p><section class="panel">${history.length?history.map((r,i)=>`<div class="record"><div><strong>${r.items.length}문항 모의시험</strong><br><span class="small muted">${new Date(r.finished).toLocaleString('ko-KR')} · ${r.result.pending}문항 채점 대기</span></div><strong>${r.result.percent===null?'—':r.result.percent+'%'}</strong><button class="secondary" data-action="record" data-index="${i}">결과 보기</button></div>`).join(''):'<div class="empty"><h2>첫 번째 기록을 기다리고 있어요.</h2><p class="muted">시험을 제출하면 여기에 학습 기록이 쌓여요.</p><button class="primary" data-action="home">시험 준비하기</button></div>'}</section>`;}
function listen(){const q=current?.items[current.index];if(!q?.transcript)return;const status=$('#audioStatus');if(!('speechSynthesis'in window)){status.textContent='이 브라우저는 음성 재생을 지원하지 않아요.';return;}stopSpeech();const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith('ko')&&v.localService);if(!voice){status.textContent='오프라인 한국어 음성을 찾지 못했어요. ‘대본으로 연습’을 이용하거나 기기에 한국어 음성을 설치해 주세요.';return;}const utter=new SpeechSynthesisUtterance(q.transcript);utter.voice=voice;utter.lang='ko-KR';utter.rate=.9;utter.onstart=()=>{if($('#audioStatus'))$('#audioStatus').textContent='재생 중이에요…';};utter.onend=()=>{if($('#audioStatus'))$('#audioStatus').textContent='재생이 끝났어요. 다시 들을 수 있어요.';};utter.onerror=()=>{if($('#audioStatus'))$('#audioStatus').textContent='음성 재생이 중단되었어요. 다시 시도해 주세요.';};speechSynthesis.speak(utter);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
 if(action==='home')home();else if(action==='history')showHistory();else if(action==='start')start();else if(action==='resume'){exam();window.scrollTo(0,0);}else if(action==='confirm')confirmSubmit();else if(action==='record')result(history[Number(b.dataset.index)]);else if(action==='export'&&reviewRecord){const url=URL.createObjectURL(new Blob([JSON.stringify(reviewRecord,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`kmock-result-${new Date(reviewRecord.finished).toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 else if(current){if(action==='map'){const open=$('#questionMap').classList.toggle('is-open');b.setAttribute('aria-expanded',String(open));window.scrollTo(0,0);}else if(action==='flag'){const id=current.items[current.index].id;current.flags=current.flags.includes(id)?current.flags.filter(x=>x!==id):[...current.flags,id];persist();exam();}else if(['prev','next','jump'].includes(action)){current.index=action==='jump'?Number(b.dataset.index):current.index+(action==='next'?1:-1);current.index=Math.max(0,Math.min(current.items.length-1,current.index));persist();exam();$('#questionTitle')?.focus();window.scrollTo(0,0);}else if(action==='transcript'){const q=current.items[current.index];$('#transcriptPanel').hidden=!$('#transcriptPanel').hidden;if(!$('#transcriptPanel').hidden){current.transcriptViewed=current.transcriptViewed||[];if(!current.transcriptViewed.includes(q.id))current.transcriptViewed.push(q.id);persist();}}else if(action==='listen')listen();else if(action==='stopAudio'){stopSpeech();if($('#audioStatus'))$('#audioStatus').textContent='재생을 정지했어요.';}}
});
$('.brand').onclick=e=>{e.preventDefault();home();};
setInterval(()=>{if(!current)return;const t=remaining();const el=$('#timer')||$('#resumeTimer');if(el){el.textContent=fmt(t);el.classList.toggle('time-low',t<60);}if(t===0)submit(true);},500);
window.addEventListener('pagehide',()=>{stopSpeech();persist();});
home();if(current&&remaining()===0)submit(true);
</script></body></html>
